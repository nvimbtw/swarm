[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-connector"
version = "0.2.1"
description = "Local multi-session connector for Swarm"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.12,<4"]

[project.scripts]
swarm = "swarm_client.cli:main"

[tool.setuptools.packages.find]
include = ["swarm_client*"]
